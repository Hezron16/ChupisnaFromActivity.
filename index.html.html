<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chupisna - HTML Form Activity</title>
</head>

<body>

    <h1>HTML Form</h1>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <p>
                <label for="fname">First Name:</label><br>
                <input type="text" id="fname" name="fname">
            </p>

            <p>
                <label for="lname">Last Name:</label><br>
                <input type="text" id="lname" name="lname">
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email">
            </p>

        </fieldset>

        <fieldset>
            <legend>Gender</legend>

            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label><br>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label><br>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>

        </fieldset>

        <fieldset>
            <legend>Hobbies</legend>

            <input type="checkbox" id="reading" name="hobbies" value="Reading">
            <label for="reading">Reading</label><br>

            <input type="checkbox" id="traveling" name="hobbies" value="Traveling">
            <label for="traveling">Traveling</label><br>

            <input type="checkbox" id="sports" name="hobbies" value="Sports">
            <label for="sports">Sports</label><br>

            <input type="checkbox" id="gaming" name="hobbies" value="Gaming">
            <label for="gaming">Gaming</label><br>

            <input type="checkbox" id="music" name="hobbies" value="Listening to Music">
            <label for="music">Listening to Music</label><br>

            <input type="checkbox" id="movies" name="hobbies" value="Watching Movies">
            <label for="movies">Watching Movies</label><br>

            <input type="checkbox" id="cooking" name="hobbies" value="Cooking">
            <label for="cooking">Cooking</label><br>

            <input type="checkbox" id="photography" name="hobbies" value="Photography">
            <label for="photography">Photography</label><br>

            <input type="checkbox" id="drawing" name="hobbies" value="Drawing">
            <label for="drawing">Drawing</label><br>

            <input type="checkbox" id="coding" name="hobbies" value="Coding">
           <label for="coding">Coding</label>

    </fieldset>

        <p>
            <label for="comments">Additional Comments:</label><br>
            <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
        </p>

        <p>
            <input type="submit" value="Submit">
        </p>

    </form>

</body>

</html>
